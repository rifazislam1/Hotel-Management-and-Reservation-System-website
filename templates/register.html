<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Registration</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<section class="booking auth-section"><h2>Create Customer Account</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, msg in messages %}<div class="{{ category }}">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="POST"><div class="form-group"><label>Full Name</label><input type="text" name="full_name" maxlength="100" required></div>
<div class="form-group"><label>Email</label><input type="email" name="email" maxlength="100" required></div>
<div class="form-group"><label>Phone</label><input type="tel" name="phone" maxlength="20" required></div>
<div class="form-group"><label>Password (minimum 8 characters)</label><input type="password" name="password" minlength="8" required></div>
<button class="submit-btn" type="submit">Register</button>
<p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
<p class="auth-switch"><a href="{{ url_for('home') }}">Back to Home</a></p></form></section></body></html>
