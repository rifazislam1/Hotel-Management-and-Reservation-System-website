<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<section class="booking auth-section"><h2>Customer Login</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, msg in messages %}<div class="{{ category }}">{{ msg }}</div>{% endfor %}{% endwith %}
<form method="POST"><div class="form-group"><label>Email</label><input type="email" name="email" required></div>
<div class="form-group"><label>Password</label><input type="password" name="password" required></div>
<button class="submit-btn" type="submit">Login</button>
<p class="auth-switch">New customer? <a href="{{ url_for('register') }}">Create an account</a></p>
<p class="auth-switch"><a href="{{ url_for('home') }}">Back to Home</a></p></form></section></body></html>
